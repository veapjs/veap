name: "Feature Request"
description: "Propose a new feature or improvement for Veap"
title: "[FEATURE]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature for Veap.

        Feature requests should describe a real problem or use case.
        The proposed implementation is a starting point for discussion, not a requirement.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What problem does this feature solve?
        Describe the problem rather than only describing the desired feature.
      placeholder: |
        Currently, when building a Veap application...

        The problem is...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: |
        Describe a concrete scenario where this feature would be useful.
      placeholder: |
        Example:

        A developer building a multi-tenant application needs to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Describe how you think the feature should work.

        Include API examples, configuration, CLI commands, module/plugin behavior,
        or other implementation details when relevant.
      placeholder: |
        Example:

        ```ts
        // proposed API
        ```
    validations:
      required: true

  - type: textarea
    id: architecture
    attributes:
      label: Architecture & modularity
      description: |
        How should this feature fit into Veap's architecture?

        If applicable, identify the package, module, plugin, CLI, or framework layer
        that should provide the functionality.
      placeholder: |
        Area:
        - @veap/core
        - CLI
        - Module
        - Plugin
        - Adapter
        - Other

        Integration:
        ...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        What alternative solutions have you considered?
        Why are existing Veap APIs or patterns insufficient?

  - type: textarea
    id: examples
    attributes:
      label: Prior art / examples
      description: |
        Provide examples from other frameworks, libraries, or real-world applications
        if relevant. Links are welcome.

  - type: textarea
    id: breaking-changes
    attributes:
      label: Breaking changes
      description: |
        Would this feature require breaking changes to existing APIs, configuration,
        modules, plugins, or applications?
      placeholder: |
        None

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Add any other information that may help evaluate the proposal.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions.
          required: true
        - label: I have checked that this feature does not already exist.
          required: true
        - label: I have described a concrete problem and use case.
          required: true
        - label: I understand that the final implementation may differ from my proposal.
          required: true
